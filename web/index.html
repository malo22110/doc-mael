<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="affluence_app">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Affluence Cabinet</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #splash {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .logo {
      width: 120px;
      height: 120px;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <svg class="logo" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
      <defs>
        <!-- Dégradé bleu-vert (teal) -->
        <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#2397B5" />
          <stop offset="100%" stop-color="#1D829B" />
        </linearGradient>

        <!-- Dégradé orange corail -->
        <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#E05A32" />
          <stop offset="100%" stop-color="#D4542E" />
        </linearGradient>

        <!-- Ombre douce sous l'icône -->
        <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
        </filter>
      </defs>

      <!-- Fond arrondi (squircle PWA) -->
      <rect width="120" height="120" rx="30" fill="#FFFFFF" filter="url(#softShadow)" />
      <rect width="120" height="120" rx="30" fill="none" stroke="#E2E8F0" stroke-width="2" />

      <!-- Anneau cadran horloge (Bleu-vert) -->
      <circle cx="60" cy="60" r="42" fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-dasharray="190 65" stroke-linecap="round" />

      <!-- Repères d'heures discrets -->
      <circle cx="60" cy="22" r="2.5" fill="#1D829B" opacity="0.6" />
      <circle cx="98" cy="60" r="2.5" fill="#1D829B" opacity="0.6" />
      <circle cx="60" cy="98" r="2.5" fill="#1D829B" opacity="0.6" />
      <circle cx="22" cy="60" r="2.5" fill="#1D829B" opacity="0.6" />

      <!-- Croix médicale centrale (Bleu-vert) -->
      <rect x="53" y="38" width="14" height="44" rx="7" fill="url(#tealGrad)" />
      <rect x="38" y="53" width="44" height="14" rx="7" fill="url(#tealGrad)" />

      <!-- Aiguille active / flux d'attente (Orange Corail) -->
      <path d="M 60 60 L 86 42" stroke="url(#orangeGrad)" stroke-width="5.5" stroke-linecap="round" />
      <circle cx="60" cy="60" r="6" fill="url(#orangeGrad)" />
    </svg>
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the splash screen when Flutter app is ready
    window.addEventListener('load', function(ev) {
      // In Flutter 3.22+, flutter_bootstrap.js will load the engine.
      // The splash will automatically be covered or we can remove it.
      // For safety, we remove it after a few seconds or leave it if it gets hidden.
      // Usually Flutter attaches to a container or replaces the body content.
      // If it doesn't, we can listen for a flutter event, but modern Flutter does it for us.
    });
  </script>
</body>
</html>
