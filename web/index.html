<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Doc'Mael">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Doc'Mael</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #F8FAFC;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    #splash {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      width: 100vw;
    }
    .logo {
      width: 200px;
      height: auto;
      animation: pulse 1.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; }
      100% { transform: scale(0.95); opacity: 0.8; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="logo_text.png" alt="DocMael Logo" class="logo" />
  </div>

  <script src="flutter_bootstrap.js" async></script>
  <script>
    // Remove the splash screen when Flutter app is ready
    window.addEventListener('load', function(ev) {
      // In Flutter 3.22+, flutter_bootstrap.js will load the engine.
      // The splash will automatically be covered or we can remove it.
      // For safety, we remove it after a few seconds or leave it if it gets hidden.
      // Usually Flutter attaches to a container or replaces the body content.
      // If it doesn't, we can listen for a flutter event, but modern Flutter does it for us.
    });
  </script>
</body>
</html>
