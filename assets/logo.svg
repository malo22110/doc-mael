<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Dégradé bleu-vert (teal) -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2397B5" />
      <stop offset="100%" stop-color="#1D829B" />
    </linearGradient>

    <!-- Dégradé orange corail -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05A32" />
      <stop offset="100%" stop-color="#D4542E" />
    </linearGradient>

    <!-- Ombre douce sous l'icône -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#0f172a" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Fond arrondi (squircle PWA) -->
  <rect width="120" height="120" rx="30" fill="#FFFFFF" filter="url(#softShadow)" />
  <rect width="120" height="120" rx="30" fill="none" stroke="#E2E8F0" stroke-width="2" />

  <!-- Anneau cadran horloge (Bleu-vert) -->
  <circle cx="60" cy="60" r="42" fill="none" stroke="url(#tealGrad)" stroke-width="5" stroke-dasharray="190 65" stroke-linecap="round" />

  <!-- Repères d'heures discrets -->
  <circle cx="60" cy="22" r="2.5" fill="#1D829B" opacity="0.6" />
  <circle cx="98" cy="60" r="2.5" fill="#1D829B" opacity="0.6" />
  <circle cx="60" cy="98" r="2.5" fill="#1D829B" opacity="0.6" />
  <circle cx="22" cy="60" r="2.5" fill="#1D829B" opacity="0.6" />

  <!-- Croix médicale centrale (Bleu-vert) -->
  <rect x="53" y="38" width="14" height="44" rx="7" fill="url(#tealGrad)" />
  <rect x="38" y="53" width="44" height="14" rx="7" fill="url(#tealGrad)" />

  <!-- Aiguille active / flux d'attente (Orange Corail) -->
  <path d="M 60 60 L 86 42" stroke="url(#orangeGrad)" stroke-width="5.5" stroke-linecap="round" />
  <circle cx="60" cy="60" r="6" fill="url(#orangeGrad)" />
</svg>
