<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 100" width="100%" height="100%">
  <defs>
    <!-- Dégradé bleu-vert (teal) -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2397B5"/>
      <stop offset="100%" stop-color="#1D829B"/>
    </linearGradient>

    <!-- Dégradé orange corail -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E05A32"/>
      <stop offset="100%" stop-color="#D4542E"/>
    </linearGradient>

    <!-- Ombre douce -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- === ICÔNE (x: 6, y: 6, taille: 88x88) === -->
  <g transform="translate(6, 6)">
    <!-- Fond squircle arrondi -->
    <rect width="88" height="88" rx="22" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" filter="url(#softShadow)"/>

    <!-- Anneau cadran horloge -->
    <circle cx="44" cy="44" r="31" fill="none" stroke="url(#tealGrad)" stroke-width="4.5" stroke-dasharray="140 45" stroke-linecap="round"/>

    <!-- Repères cadran -->
    <circle cx="44" cy="16" r="2" fill="#1D829B" opacity="0.6"/>
    <circle cx="72" cy="44" r="2" fill="#1D829B" opacity="0.6"/>
    <circle cx="44" cy="72" r="2" fill="#1D829B" opacity="0.6"/>
    <circle cx="16" cy="44" r="2" fill="#1D829B" opacity="0.6"/>

    <!-- Croix médicale centrale -->
    <rect x="39" y="27" width="10" height="34" rx="5" fill="url(#tealGrad)"/>
    <rect x="27" y="39" width="34" height="10" rx="5" fill="url(#tealGrad)"/>

    <!-- Aiguille dynamique -->
    <path d="M 44 44 L 64 30" stroke="url(#orangeGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="44" cy="44" r="4.5" fill="url(#orangeGrad)"/>
  </g>

  <!-- === TEXTE DOC'MAEL === -->
  <text x="114" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1px">
    <tspan fill="#FFFFFF">Doc’</tspan><tspan fill="#D4542E">Mael</tspan>
  </text>
</svg>
